# Golden CI floor — see dotfiles/templates/ci/README.md.
# petvity: pnpm + vitest. 61 test files / ~541 cases that never ran on the shared
# branch until now. No `typecheck` script exists, so tsc is invoked directly.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # SSOT: one definition of "verified" (lint + typecheck + test) lives in
      # package.json `verify`, run identically here and locally.
      - name: Verify
        run: pnpm run verify

      # Build is DEFERRED, not skipped silently: `next build` prerenders
      # /sitemap.xml, which queries Postgres (select handle from pets ...) at
      # build time, so it is NOT hermetic. To gate it, add a `postgres` service
      # + `pnpm db:push` before build (the revampit e2e-local pattern in
      # dotfiles/templates/ci/README.md). Until then the floor gates
      # lint + typecheck + the full 562-case test suite.
